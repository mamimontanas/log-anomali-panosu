<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Kayıt - Gözcü</title>
</head>
<body>
  <h1>Şirket Kaydı</h1>

  {% for mesaj in get_flashed_messages() %}
    <p><strong>{{ mesaj }}</strong></p>
  {% endfor %}

  <form method="post">
    <p><label>Şirket adı<br><input name="sirket" required></label></p>
    <p><label>Yönetici kullanıcı adı<br><input name="kullanici_adi" required></label></p>
    <p><label>Parola (en az 8 karakter)<br><input type="password" name="parola" required></label></p>
    <button type="submit">Kayıt ol</button>
  </form>

  <p><a href="/">Ana sayfa</a></p>
</body>
</html>
