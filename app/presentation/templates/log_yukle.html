<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><title>Log Yükle - Gözcü</title></head>
<body>
  <h1>Log dosyası yükle</h1>

  {% for mesaj in get_flashed_messages() %}
    <p><strong>{{ mesaj }}</strong></p>
  {% endfor %}

  <form method="post" enctype="multipart/form-data">
    <p><label>Kaynak<br>
      <select name="kaynak_id">
        <option value="">(seçin)</option>
        {% for k in kaynaklar %}<option value="{{ k.id }}">{{ k.ad }}</option>{% endfor %}
      </select></label></p>
    <p><label>veya yeni kaynak adı<br><input name="yeni_kaynak" placeholder="Örn: VPN"></label></p>
    <p><label>Log dosyası (.log veya .txt)<br><input type="file" name="dosya" accept=".log,.txt" required></label></p>
    <button type="submit">Yükle</button>
  </form>

  {% if hatalar %}
    <h2>Atlanan satırlar</h2>
    <table border="1" cellpadding="4">
      <tr><th>Satır</th><th>İçerik</th><th>Hata</th></tr>
      {% for h in hatalar %}<tr><td>{{ h.satir_no }}</td><td>{{ h.satir }}</td><td>{{ h.hata }}</td></tr>{% endfor %}
    </table>
  {% endif %}

  <p><a href="/pano">Panoya dön</a></p>
</body>
</html>
