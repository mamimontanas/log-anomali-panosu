<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 630" width="910" height="630" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="910" height="630" fill="#ffffff"/>

  <text x="455" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">P27 · Log Anomali İzleme Panosu — Mimari Şema</text>

  <!-- Kullanıcı -->
  <rect x="330" y="55" width="240" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="450" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Şirket Yöneticisi / Analist</text>
  <text x="450" y="94" text-anchor="middle" font-size="12" fill="#374151">(Tarayıcı)</text>
  <line x1="450" y1="105" x2="450" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#ok)" marker-start="url(#ok)"/>

  <!-- Sunum katmanı -->
  <rect x="230" y="140" width="440" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">SUNUM KATMANI (Flask)</text>
  <g font-size="12" fill="#111827" text-anchor="middle">
    <rect x="240" y="180" width="100" height="55" rx="6" fill="#ffffff" stroke="#3b82f6"/>
    <text x="290" y="205">Giriş /</text><text x="290" y="221">Oturum</text>
    <rect x="350" y="180" width="100" height="55" rx="6" fill="#ffffff" stroke="#3b82f6"/>
    <text x="400" y="205">Pano</text><text x="400" y="221">(grafikler)</text>
    <rect x="460" y="180" width="100" height="55" rx="6" fill="#ffffff" stroke="#3b82f6"/>
    <text x="510" y="205">Uyarı</text><text x="510" y="221">listesi</text>
    <rect x="570" y="180" width="90" height="55" rx="6" fill="#ffffff" stroke="#3b82f6"/>
    <text x="615" y="205">Kural</text><text x="615" y="221">editörü</text>
  </g>

  <line x1="450" y1="250" x2="450" y2="285" stroke="#374151" stroke-width="2" marker-end="url(#ok)" marker-start="url(#ok)"/>

  <!-- İş katmanı -->
  <rect x="230" y="285" width="440" height="130" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="450" y="307" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">İŞ KATMANI (Python)</text>
  <g font-size="12" fill="#111827" text-anchor="middle">
    <rect x="240" y="325" width="100" height="70" rx="6" fill="#ffffff" stroke="#10b981"/>
    <text x="290" y="355">Log</text><text x="290" y="371">ayrıştırıcı</text>
    <rect x="350" y="325" width="100" height="70" rx="6" fill="#ffffff" stroke="#10b981"/>
    <text x="400" y="355">Anomali</text><text x="400" y="371">kural motoru</text>
    <rect x="460" y="325" width="100" height="70" rx="6" fill="#ffffff" stroke="#10b981"/>
    <text x="510" y="355">AI özet</text><text x="510" y="371">(LLM)</text>
    <rect x="570" y="325" width="90" height="70" rx="6" fill="#ffffff" stroke="#10b981"/>
    <text x="615" y="355">Uyarı</text><text x="615" y="371">üretici</text>
  </g>

  <line x1="450" y1="415" x2="450" y2="450" stroke="#374151" stroke-width="2" marker-end="url(#ok)" marker-start="url(#ok)"/>

  <!-- Veri katmanı -->
  <rect x="230" y="450" width="440" height="90" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="450" y="472" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">VERİ KATMANI</text>
  <g font-size="12" fill="#111827" text-anchor="middle">
    <rect x="250" y="490" width="180" height="40" rx="6" fill="#ffffff" stroke="#f97316"/>
    <text x="340" y="515">db.py (pyodbc)</text>
    <rect x="470" y="490" width="180" height="40" rx="6" fill="#ffffff" stroke="#f97316"/>
    <text x="560" y="515">SQL Server · LogAnomali</text>
  </g>
  <line x1="430" y1="510" x2="470" y2="510" stroke="#374151" stroke-width="2" marker-end="url(#ok)" marker-start="url(#ok)"/>

  <!-- Sol: Log kaynakları -->
  <rect x="30" y="285" width="150" height="130" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <g font-size="12" fill="#111827" text-anchor="middle">
    <text x="105" y="318" font-weight="bold" font-size="13" fill="#4c1d95">Log Kaynakları</text>
    <text x="105" y="345">Şirket sistemleri</text>
    <text x="105" y="363">Sentetik log</text>
    <text x="105" y="381">dosyaları</text>
    <text x="105" y="399">(.log / .csv)</text>
  </g>
  <line x1="180" y1="350" x2="240" y2="350" stroke="#374151" stroke-width="2" marker-end="url(#ok)"/>

  <!-- Sağ: Harici servisler -->
  <rect x="730" y="285" width="150" height="130" rx="10" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <g font-size="12" fill="#111827" text-anchor="middle">
    <text x="805" y="318" font-weight="bold" font-size="13" fill="#831843">Harici Servisler</text>
    <text x="805" y="345">IP konum API</text>
    <text x="805" y="363">Bildirim (e-posta)</text>
    <text x="805" y="381">LLM API</text>
    <text x="805" y="399" font-size="11" fill="#6b7280">(anahtarlar .env'de)</text>
  </g>
  <line x1="660" y1="365" x2="730" y2="365" stroke="#374151" stroke-width="2" marker-end="url(#ok)" marker-start="url(#ok)"/>

  <!-- Not -->
  <rect x="140" y="570" width="630" height="42" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="455" y="596" text-anchor="middle" font-size="13" fill="#7f1d1d">Her sorguda sirket_id filtresi: şirketler birbirinin verisini göremez.</text>
</svg>
